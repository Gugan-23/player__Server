<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SpinBattle — Wheel of Fortune Duels</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg:       #0b0c10;
    --surface:  #141720;
    --card:     #1c2030;
    --border:   #2a2f42;
    --accent:   #f7c948;
    --accent2:  #ff5e5b;
    --green:    #35d07f;
    --blue:     #4ea8de;
    --text:     #e8eaf0;
    --muted:    #7a7f96;
    --radius:   12px;
    --spin-dur: 4s;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: .4;
  }

  /* ── LAYOUT ── */
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; }

  .screen { width: 100%; max-width: 460px; animation: fadeIn .35s ease; }
  .screen.wide { max-width: 860px; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* ── LOGO ── */
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 3px;
    color: var(--accent); text-shadow: 0 0 30px rgba(247,201,72,.4); text-align: center;
    margin-bottom: 6px; }
  .logo-sub { text-align:center; color: var(--muted); font-size:.85rem;
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }

  /* ── CARD ── */
  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; }

  /* ── TABS ── */
  .tab-bar { display: flex; gap: 4px; background: var(--surface);
    border-radius: 8px; padding: 4px; margin-bottom: 28px; }
  .tab-btn { flex: 1; padding: 9px; border: none; background: transparent;
    color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: .9rem;
    font-weight: 500; border-radius: 6px; cursor: pointer; transition: all .2s; }
  .tab-btn.active { background: var(--accent); color: #000; }

  /* ── FORM ── */
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: .95rem; outline: none;
    transition: border-color .2s; }
  input:focus { border-color: var(--accent); }

  /* ── BUTTONS ── */
  .btn { display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 13px 28px; border: none; border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 1.5px;
    cursor: pointer; transition: all .2s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #000; width: 100%; }
  .btn-primary:hover { background: #ffe066; transform: translateY(-1px); }
  .btn-secondary { background: var(--surface); color: var(--text);
    border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--accent2); color: #fff; }
  .btn-disabled { opacity: .4; cursor: not-allowed; }
  .btn-sm { padding: 8px 16px; font-size: .85rem; }

  /* ── ALERT ── */
  .alert { padding: 12px 16px; border-radius: 8px; font-size: .9rem;
    margin-bottom: 16px; display: none; }
  .alert.error   { background: rgba(255,94,91,.15); border: 1px solid var(--accent2); color: var(--accent2); }
  .alert.success { background: rgba(53,208,127,.15); border: 1px solid var(--green); color: var(--green); }
  .alert.show    { display: block; }

  /* ── WAITING ── */
  #waiting-screen { text-align: center; }
  .spinner { width: 56px; height: 56px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
    margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waiting-text { font-size: 1.1rem; color: var(--muted); margin-bottom: 8px; }
  .room-badge { font-family: 'Bebas Neue', sans-serif; font-size: .85rem;
    letter-spacing: 1px; color: var(--accent); background: rgba(247,201,72,.1);
    border: 1px solid rgba(247,201,72,.3); padding: 6px 14px; border-radius: 20px;
    display: inline-block; margin-top: 12px; }

  /* ── GAME SCREEN ── */
  #game-screen .game-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .round-pill { background: var(--surface); border: 1px solid var(--border);
    padding: 6px 18px; border-radius: 20px; font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem; letter-spacing: 1px; }
  .round-pill span { color: var(--accent); }

  /* ── PLAYERS ROW ── */
  .players-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px;
    align-items: center; margin-bottom: 24px; }
  .player-card { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; text-align: center; transition: border-color .3s; }
  .player-card.me  { border-color: var(--blue); }
  .player-card.opp { border-color: var(--accent2); }
  .player-label { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 4px; }
  .player-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem;
    letter-spacing: 1px; }
  .player-score { font-size: 2rem; font-weight: 600; color: var(--accent);
    line-height: 1; margin-top: 8px; }
  .player-spin { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .vs-badge { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem;
    color: var(--muted); text-align: center; }

  /* ── WHEEL ── */
  .wheel-section { text-align: center; margin-bottom: 24px; }
  #wheel-canvas { border-radius: 50%; box-shadow: 0 0 40px rgba(247,201,72,.15);
    transition: transform var(--spin-dur) cubic-bezier(.17,.67,.35,.99); display: block;
    margin: 0 auto; }
  .wheel-pointer { font-size: 1.5rem; margin-bottom: -4px; display: block; }

  /* ── SPIN BUTTON ── */
  #spin-btn { margin: 20px auto 0; display: block; min-width: 200px;
    font-size: 1.3rem; padding: 16px 40px; }
  #spin-btn:not(.btn-disabled):hover { transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(247,201,72,.3); }

  /* ── ROUND RESULT TOAST ── */
  #round-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 28px; text-align: center; z-index: 100; opacity: 0;
    transition: opacity .3s; pointer-events: none; min-width: 280px; }
  #round-toast.show { opacity: 1; }
  #round-toast .toast-title { font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem; letter-spacing: 1px; margin-bottom: 6px; }
  #round-toast .toast-detail { font-size: .85rem; color: var(--muted); }

  /* ── GAME OVER ── */
  #gameover-screen { text-align: center; }
  .result-trophy { font-size: 4rem; margin-bottom: 8px; }
  .result-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem;
    letter-spacing: 3px; margin-bottom: 4px; }
  .result-subtitle { color: var(--muted); margin-bottom: 28px; }
  .score-breakdown { display: flex; gap: 16px; justify-content: center;
    margin-bottom: 28px; }
  .score-box { background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 28px; text-align: center; }
  .score-box .sb-name { font-size: .8rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; }
  .score-box .sb-val { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .gameover-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ── STATS ROW ── */
  .stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-chip { background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; font-size: .82rem; }
  .stat-chip strong { color: var(--accent); }

  /* ── LEADERBOARD MODAL ── */
  #lb-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    backdrop-filter: blur(6px); z-index: 200; align-items: center; justify-content: center; }
  #lb-modal.show { display: flex; }
  .lb-card { background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; width: 100%; max-width: 500px;
    max-height: 80vh; overflow-y: auto; }
  .lb-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; }
  .lb-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; }
  .lb-close { background: none; border: none; color: var(--muted); font-size: 1.4rem;
    cursor: pointer; }
  .lb-table { width: 100%; border-collapse: collapse; }
  .lb-table th { font-size: .75rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); border-bottom: 1px solid var(--border); padding: 8px 12px;
    text-align: left; }
  .lb-table td { padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,.04);
    font-size: .9rem; }
  .lb-table tr:first-child td { color: var(--accent); font-weight: 600; }
  .rank-badge { font-family: 'Bebas Neue', sans-serif; font-size:.9rem;
    width:26px; height:26px; border-radius: 50%; display:inline-flex; align-items:center;
    justify-content:center; background: var(--surface); }

  /* ── ROOMS MODAL ── */
  #rooms-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
    backdrop-filter:blur(6px); z-index:200; align-items:center; justify-content:center; }
  #rooms-modal.show { display:flex; }
  .room-row { background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; }
  .room-row .rr-id { font-family: 'Bebas Neue', sans-serif; font-size:.9rem;
    color: var(--accent); letter-spacing: 1px; margin-bottom: 4px; }
  .room-row .rr-info { font-size: .85rem; color: var(--muted); }
  .state-pill { font-size: .7rem; padding: 2px 8px; border-radius: 10px;
    font-weight: 600; text-transform: uppercase; }
  .state-active { background: rgba(78,168,222,.2); color: var(--blue); }
  .state-done   { background: rgba(53,208,127,.15); color: var(--green); }
  .state-abandoned { background: rgba(255,94,91,.15); color: var(--accent2); }

  /* ── NAV STRIP ── */
  .nav-strip { display:flex; gap:10px; justify-content:flex-end; margin-bottom:18px;
    flex-wrap: wrap; }

  /* ── RESPONSIVE ── */
  @media (max-width:560px) {
    .players-row { grid-template-columns: 1fr; }
    .vs-badge { display:none; }
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ████ AUTH SCREEN ████ -->
  <div class="screen" id="auth-screen">
    <div class="logo">SpinBattle</div>
    <div class="logo-sub">Wheel of Fortune Duels</div>
    <div class="card">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-login"    onclick="switchTab('login')">Login</button>
        <button class="tab-btn"        id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login -->
      <div id="form-login">
        <div class="alert error" id="login-err"></div>
        <div class="alert success" id="login-ok"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-user" placeholder="your username" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"
            onkeydown="if(event.key==='Enter') doLogin()"/>
        </div>
        <button class="btn btn-primary" onclick="doLogin()">Login & Play</button>
      </div>

      <!-- Register -->
      <div id="form-register" style="display:none">
        <div class="alert error"   id="reg-err"></div>
        <div class="alert success" id="reg-ok"></div>
        <div class="form-group">
          <label>Choose Username</label>
          <input type="text" id="reg-user" placeholder="your username" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label>Choose Password <span style="color:var(--muted);font-weight:400">(min 4 chars)</span></label>
          <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="new-password"
            onkeydown="if(event.key==='Enter') doRegister()"/>
        </div>
        <button class="btn btn-primary" onclick="doRegister()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- ████ WAITING SCREEN ████ -->
  <div class="screen" id="waiting-screen" style="display:none">
    <div class="logo">SpinBattle</div>
    <div class="card" style="text-align:center">
      <div class="spinner"></div>
      <div class="waiting-text" id="wait-msg">Connecting…</div>
      <div id="wait-room" class="room-badge" style="display:none"></div>
      <br/><br/>
      <div id="my-stats-row" class="stats-row" style="justify-content:center"></div>
      <br/>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="openLeaderboard()">🏆 Leaderboard</button>
        <button class="btn btn-secondary btn-sm" onclick="openRooms()">🎮 Room History</button>
        <button class="btn btn-secondary btn-sm" style="color:var(--accent2)" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <!-- ████ GAME SCREEN ████ -->
  <div class="screen wide" id="game-screen" style="display:none">
    <div class="nav-strip">
      <button class="btn btn-secondary btn-sm" onclick="openLeaderboard()">🏆 Leaderboard</button>
      <button class="btn btn-secondary btn-sm" onclick="openRooms()">🎮 Rooms</button>
    </div>

    <div class="game-header">
      <div class="room-badge" id="game-room-id"></div>
      <div class="round-pill">Round <span id="cur-round">1</span> / <span id="tot-rounds">3</span></div>
    </div>

    <div class="players-row">
      <!-- MY CARD -->
      <div class="player-card me" id="my-card">
        <div class="player-label">You</div>
        <div class="player-name" id="my-name">—</div>
        <div class="player-score" id="my-score">0</div>
        <div class="player-spin" id="my-spin">—</div>
      </div>
      <div class="vs-badge">VS</div>
      <!-- OPP CARD -->
      <div class="player-card opp" id="opp-card">
        <div class="player-label">Opponent</div>
        <div class="player-name" id="opp-name">—</div>
        <div class="player-score" id="opp-score">0</div>
        <div class="player-spin" id="opp-spin">—</div>
      </div>
    </div>

    <!-- WHEEL -->
    <div class="wheel-section">
      <span class="wheel-pointer">▼</span>
      <canvas id="wheel-canvas" width="300" height="300"></canvas>
    </div>

    <button class="btn btn-primary" id="spin-btn" onclick="doSpin()">SPIN!</button>
    <div style="text-align:center;margin-top:10px">
      <small id="spin-hint" style="color:var(--muted)">Click SPIN to spin the wheel!</small>
    </div>
  </div>

  <!-- ████ GAME OVER SCREEN ████ -->
  <div class="screen" id="gameover-screen" style="display:none">
    <div class="card" style="text-align:center">
      <div class="result-trophy" id="go-trophy">🏆</div>
      <div class="result-title" id="go-title">WINNER!</div>
      <div class="result-subtitle" id="go-sub"></div>
      <div class="score-breakdown">
        <div class="score-box">
          <div class="sb-name" id="go-p1-name"></div>
          <div class="sb-val"  id="go-p1-score"></div>
        </div>
        <div class="score-box">
          <div class="sb-name" id="go-p2-name"></div>
          <div class="sb-val"  id="go-p2-score"></div>
        </div>
      </div>
      <div class="room-badge" id="go-room" style="margin-bottom:20px"></div>
      <div class="gameover-btns">
        <button class="btn btn-primary"    onclick="doRematch()">🔁 Rematch</button>
        <button class="btn btn-secondary"  onclick="goBackToLobby()">🔍 Find New Opponent</button>
        <button class="btn btn-secondary"  onclick="openLeaderboard()">🏆 Leaderboard</button>
      </div>
    </div>
  </div>

</div>

<!-- ████ ROUND TOAST ████ -->
<div id="round-toast">
  <div class="toast-title" id="toast-title"></div>
  <div class="toast-detail" id="toast-detail"></div>
</div>

<!-- ████ LEADERBOARD MODAL ████ -->
<div id="lb-modal">
  <div class="lb-card">
    <div class="lb-header">
      <h2>🏆 Leaderboard</h2>
      <button class="lb-close" onclick="closeLB()">✕</button>
    </div>
    <table class="lb-table">
      <thead><tr>
        <th>#</th><th>Player</th><th>Points</th><th>Wins</th><th>Games</th><th>Best Spin</th>
      </tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>
</div>

<!-- ████ ROOMS MODAL ████ -->
<div id="rooms-modal">
  <div class="lb-card">
    <div class="lb-header">
      <h2>🎮 Room History</h2>
      <button class="lb-close" onclick="closeRooms()">✕</button>
    </div>
    <div id="rooms-body"></div>
  </div>
</div>

<script>
/* ======================================
   STATE
====================================== */
let socket       = null;
let myUsername   = null;
let myRoomId     = null;
let myTotalRounds= 3;
let myRound      = 1;
let myScore      = 0;
let oppScore     = 0;
let hasSpin      = false;
let spinning     = false;
const SEGMENTS   = [100,200,300,400,500,50,150,250,350,450];
const SEG_COLORS = [
  '#f7c948','#ff5e5b','#4ea8de','#35d07f','#b07af7',
  '#f7a948','#ff9b5e','#5ec4de','#8dd35e','#de5e9b'
];

/* ======================================
   AUTH TABS
====================================== */
function switchTab(t) {
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    t==='login');
  document.getElementById('tab-register').classList.toggle('active', t==='register');
}
function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

async function doRegister() {
  const u = document.getElementById('reg-user').value.trim();
  const p = document.getElementById('reg-pass').value.trim();
  if (!u || !p) { showAlert('reg-err','Fill all fields'); return; }
  const r = await fetch('/api/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  });
  const d = await r.json();
  if (!r.ok) { showAlert('reg-err', d.error); return; }
  showAlert('reg-ok', 'Account created! Logging in…');
  setTimeout(() => { switchTab('login');
    document.getElementById('login-user').value = u; }, 900);
}

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  if (!u || !p) { showAlert('login-err','Fill all fields'); return; }
  const r = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  });
  const d = await r.json();
  if (!r.ok) { showAlert('login-err', d.error); return; }
  myUsername = d.username;
  showScreen('waiting-screen');
  initSocket();
}

function logout() {
  if (socket) socket.disconnect();
  socket = null; myUsername = null; myRoomId = null;
  showScreen('auth-screen');
}

/* ======================================
   SOCKET
====================================== */
function initSocket() {
  if (socket) socket.disconnect();
  socket = io();

  socket.on('connect', () => {
    document.getElementById('wait-msg').textContent = 'Looking for an opponent…';
    socket.emit('join', { username: myUsername });
  });

  socket.on('state', (d) => {
    if (d.status === 'waiting') {
      document.getElementById('wait-msg').textContent = d.message;
      renderWaitStats(d.stats);
    }
    if (d.status === 'matched' || d.status === 'rematch') {
      myRoomId      = d.room;
      myTotalRounds = d.total_rounds;
      myRound       = d.round;
      myScore       = 0; oppScore = 0; hasSpin = false; spinning = false;
      document.getElementById('my-name').textContent  = d.your_name;
      document.getElementById('opp-name').textContent = d.opponent;
      document.getElementById('my-score').textContent  = '0';
      document.getElementById('opp-score').textContent = '0';
      document.getElementById('my-spin').textContent   = '—';
      document.getElementById('opp-spin').textContent  = '—';
      document.getElementById('game-room-id').textContent = '🎮 ' + d.room;
      document.getElementById('cur-round').textContent   = d.round;
      document.getElementById('tot-rounds').textContent  = d.total_rounds;
      resetSpinBtn();
      drawWheel(0);
      showScreen('game-screen');
    }
    if (d.status === 'opponent_left') {
      showToast('⚠️ Opponent Left', d.message, 5000);
      setTimeout(() => goBackToLobby(), 5000);
    }
  });

  socket.on('spin_result', (d) => {
    const isMe = (d.username === myUsername);
    if (isMe) {
      document.getElementById('my-spin').textContent = `Last spin: ${d.value}`;
      triggerWheelSpin(d.degrees);
    } else {
      document.getElementById('opp-spin').textContent = `Last spin: ${d.value}`;
    }
  });

  socket.on('round_result', (d) => {
    // update totals
    const p1 = d.p1, p2 = d.p2;
    const me   = (p1.username === myUsername) ? p1 : p2;
    const opp  = (p1.username === myUsername) ? p2 : p1;
    myScore  = me.total;  oppScore = opp.total;
    document.getElementById('my-score').textContent  = myScore;
    document.getElementById('opp-score').textContent = oppScore;
    myRound  = d.next_round;
    document.getElementById('cur-round').textContent = d.next_round;

    const rw = d.round_winner === myUsername ? '✅ You won this round!'
             : d.round_winner === 'Tie'      ? '🤝 Round Tied!'
             :                                 `❌ ${d.round_winner} won this round`;
    showToast(rw, `Round ${d.next_round-1} done — Starting Round ${d.next_round}…`);

    hasSpin = false; spinning = false;
    resetSpinBtn();
    drawWheel(0);
    document.getElementById('my-spin').textContent  = '—';
    document.getElementById('opp-spin').textContent = '—';
  });

  socket.on('game_over', (d) => {
    const p1 = d.p1, p2 = d.p2;
    const me  = (p1.username === myUsername) ? p1 : p2;
    const opp = (p1.username === myUsername) ? p2 : p1;
    document.getElementById('go-p1-name').textContent  = me.username;
    document.getElementById('go-p1-score').textContent = me.total;
    document.getElementById('go-p2-name').textContent  = opp.username;
    document.getElementById('go-p2-score').textContent = opp.total;
    document.getElementById('go-room').textContent     = '🎮 ' + d.room_id;

    if (d.winner === myUsername) {
      document.getElementById('go-trophy').textContent = '🏆';
      document.getElementById('go-title').textContent  = 'YOU WIN!';
      document.getElementById('go-title').style.color  = 'var(--green)';
      document.getElementById('go-sub').textContent    = 'Incredible! You dominated the wheel.';
    } else if (d.winner === 'Tie') {
      document.getElementById('go-trophy').textContent = '🤝';
      document.getElementById('go-title').textContent  = 'IT\'S A TIE!';
      document.getElementById('go-title').style.color  = 'var(--accent)';
      document.getElementById('go-sub').textContent    = 'Equally matched!';
    } else {
      document.getElementById('go-trophy').textContent = '💀';
      document.getElementById('go-title').textContent  = 'YOU LOST!';
      document.getElementById('go-title').style.color  = 'var(--accent2)';
      document.getElementById('go-sub').textContent    = `${d.winner} takes the victory.`;
    }
    showScreen('gameover-screen');
  });

  socket.on('error', (d) => showToast('⚠️ Error', d.message, 3000));
  socket.on('leaderboard', (d) => renderLeaderboard(d.data));

  socket.on('disconnect', () => {
    document.getElementById('wait-msg').textContent = 'Disconnected. Reconnecting…';
  });
}

/* ======================================
   SPIN
====================================== */
function doSpin() {
  if (hasSpin || spinning) return;
  socket.emit('spin');
  hasSpin  = true; spinning = true;
  const btn = document.getElementById('spin-btn');
  btn.classList.add('btn-disabled');
  btn.textContent = 'Spinning…';
  document.getElementById('spin-hint').textContent = 'Waiting for opponent to spin…';
}

function resetSpinBtn() {
  const btn = document.getElementById('spin-btn');
  btn.classList.remove('btn-disabled');
  btn.textContent = 'SPIN!';
  document.getElementById('spin-hint').textContent = 'Click SPIN to spin the wheel!';
}

/* ======================================
   WHEEL DRAWING
====================================== */
function drawWheel(rotation) {
  const canvas = document.getElementById('wheel-canvas');
  const ctx    = canvas.getContext('2d');
  const cx     = canvas.width / 2;
  const cy     = canvas.height / 2;
  const r      = cx - 6;
  const arc    = (2 * Math.PI) / SEGMENTS.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < SEGMENTS.length; i++) {
    const startAngle = rotation + i * arc;
    const endAngle   = startAngle + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = SEG_COLORS[i];
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.font = 'bold 13px DM Sans, sans-serif';
    ctx.fillText(SEGMENTS[i], r - 10, 5);
    ctx.restore();
  }

  // center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, 2*Math.PI);
  ctx.fillStyle = '#0b0c10';
  ctx.fill();
  ctx.strokeStyle = 'var(--accent)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

let wheelAngle = 0;
let wheelAnim  = null;

function triggerWheelSpin(degrees) {
  const duration = 4000;
  const start    = performance.now();
  const startAng = wheelAngle;
  const endAng   = startAng + (degrees * Math.PI / 180);

  function frame(now) {
    const elapsed = now - start;
    const t       = Math.min(elapsed / duration, 1);
    const ease    = 1 - Math.pow(1 - t, 4); // ease-out quartic
    const cur     = startAng + (endAng - startAng) * ease;
    drawWheel(cur);
    if (t < 1) {
      wheelAnim = requestAnimationFrame(frame);
    } else {
      wheelAngle = endAng % (2 * Math.PI);
      spinning = false;
    }
  }
  if (wheelAnim) cancelAnimationFrame(wheelAnim);
  requestAnimationFrame(frame);
}

/* ======================================
   TOAST
====================================== */
let toastTimer = null;
function showToast(title, detail, ms = 3500) {
  const t = document.getElementById('round-toast');
  document.getElementById('toast-title').textContent  = title;
  document.getElementById('toast-detail').textContent = detail;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ======================================
   HELPERS
====================================== */
function showScreen(id) {
  ['auth-screen','waiting-screen','game-screen','gameover-screen']
    .forEach(s => document.getElementById(s).style.display = s===id ? '' : 'none');
  if (id==='waiting-screen') {
    document.getElementById('wait-room').style.display = 'none';
  }
}

function renderWaitStats(stats) {
  if (!stats) return;
  const row = document.getElementById('my-stats-row');
  row.innerHTML = `
    <div class="stat-chip">Games: <strong>${stats.games_played||0}</strong></div>
    <div class="stat-chip">Wins: <strong>${stats.games_won||0}</strong></div>
    <div class="stat-chip">Points: <strong>${stats.total_points||0}</strong></div>
    <div class="stat-chip">Best Spin: <strong>${stats.highest_spin||0}</strong></div>
  `;
}

function doRematch() { socket.emit('rematch'); }

function goBackToLobby() {
  showScreen('waiting-screen');
  document.getElementById('wait-msg').textContent = 'Looking for an opponent…';
  socket.emit('join', { username: myUsername });
}

/* ======================================
   LEADERBOARD
====================================== */
function openLeaderboard() {
  socket.emit('get_leaderboard');
  document.getElementById('lb-modal').classList.add('show');
}
function closeLB()    { document.getElementById('lb-modal').classList.remove('show'); }
function closeRooms() { document.getElementById('rooms-modal').classList.remove('show'); }

function renderLeaderboard(data) {
  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = data.map((p, i) => `
    <tr>
      <td><span class="rank-badge">${i+1}</span></td>
      <td>${p.username}</td>
      <td><strong style="color:var(--accent)">${p.total_points}</strong></td>
      <td>${p.games_won}</td>
      <td>${p.games_played}</td>
      <td>${p.highest_spin}</td>
    </tr>
  `).join('');
}

/* ======================================
   ROOM HISTORY
====================================== */
async function openRooms() {
  const r = await fetch('/api/rooms');
  const data = await r.json();
  const body = document.getElementById('rooms-body');
  if (!data.length) {
    body.innerHTML = '<p style="color:var(--muted);text-align:center">No rooms yet.</p>';
  } else {
    body.innerHTML = data.map(room => {
      const ps = room.players || [];
      const sc = room.scores  || {};
      const stateClass = room.state==='done' ? 'state-done'
                       : room.state==='active' ? 'state-active' : 'state-abandoned';
      const scStr = ps.map(p => `${p}: ${sc[p]||0}`).join(' vs ');
      return `<div class="room-row">
        <div class="rr-id">🎮 ${room.room_id}</div>
        <div class="rr-info">
          ${scStr} &nbsp;·&nbsp;
          ${room.winner ? `Winner: <strong>${room.winner}</strong> &nbsp;·&nbsp;` : ''}
          <span class="state-pill ${stateClass}">${room.state}</span>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('rooms-modal').classList.add('show');
}

/* ======================================
   INIT
====================================== */
drawWheel(0);
showScreen('auth-screen');
</script>
