<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎡 Spin Battle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --border: #1e1e2e;
    --accent: #f0c040;
    --accent2: #ff4d6d;
    --accent3: #4dffa0;
    --text: #e8e8f0;
    --muted: #555570;
    --glow: 0 0 20px rgba(240,192,64,0.4);
    --glow2: 0 0 20px rgba(255,77,109,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(240,192,64,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,77,109,0.04) 0%, transparent 50%);
  }

  /* ── STARS ── */
  .stars {
    position: fixed; inset:0; pointer-events:none; z-index:0;
    background: transparent;
  }
  .stars::before, .stars::after {
    content:'';
    position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.2) 0%, transparent 100%);
  }

  /* ── SCREENS ── */
  .screen { display:none; position:relative; z-index:1; }
  .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }

  /* ── LOBBY ── */
  #lobby {
    gap: 2rem;
  }

  .logo {
    font-family: 'Bungee', cursive;
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: var(--accent);
    text-shadow: var(--glow), 0 0 60px rgba(240,192,64,0.2);
    letter-spacing: 4px;
    animation: pulse 3s ease-in-out infinite;
  }
  .logo span { color: var(--accent2); }

  @keyframes pulse {
    0%,100% { text-shadow: var(--glow), 0 0 60px rgba(240,192,64,0.2); }
    50% { text-shadow: 0 0 40px rgba(240,192,64,0.8), 0 0 80px rgba(240,192,64,0.4); }
  }

  .subtitle {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .input-group {
    display:flex; flex-direction:column; gap:0.75rem; width:100%; max-width:360px;
  }

  .input-group label {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    width: 100%;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  .btn {
    padding: 1rem 2.5rem;
    border: none;
    border-radius: 8px;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #e08800);
    color: #0a0a0f;
    box-shadow: var(--glow);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(240,192,64,0.6);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-secondary:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .btn-spin {
    background: linear-gradient(135deg, var(--accent2), #c0003a);
    color: white;
    font-size: 1rem;
    padding: 1.25rem 3rem;
    box-shadow: var(--glow2);
    width: 100%;
    max-width: 300px;
  }
  .btn-spin:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 50px rgba(255,77,109,0.7);
  }
  .btn-spin:disabled {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  /* ── WAITING ── */
  .waiting-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3rem;
    text-align: center;
    max-width: 400px;
    width: 100%;
  }

  .spinner-dots {
    display:flex; gap:8px; justify-content:center; margin:1.5rem 0;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
  .dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent3); }

  @keyframes bounce {
    0%,80%,100% { transform:scale(0.6); opacity:0.5; }
    40% { transform:scale(1); opacity:1; }
  }

  /* ── GAME SCREEN ── */
  #game {
    gap: 1.5rem;
    padding: 1.5rem;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  .game-header {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; padding:1rem 1.5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .round-badge {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .vs-text {
    font-family: 'Bungee', cursive;
    font-size: 1.5rem;
    color: var(--accent2);
    text-shadow: var(--glow2);
  }

  /* ── SCORE CARDS ── */
  .scores {
    display:grid; grid-template-columns: 1fr 1fr;
    gap: 1rem; width:100%;
  }

  .score-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    text-align: center;
    transition: border-color 0.3s;
  }

  .score-card.me { border-color: rgba(240,192,64,0.3); }
  .score-card.opponent { border-color: rgba(255,77,109,0.2); }

  .score-card .player-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .score-card .player-name {
    font-family: 'Bungee', cursive;
    font-size: 1.3rem;
    color: var(--accent);
    margin-bottom: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .score-card.opponent .player-name { color: var(--accent2); }

  .score-card .score-val {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    color: var(--text);
  }

  /* ── WHEELS AREA ── */
  .wheels-area {
    display:grid; grid-template-columns: 1fr 1fr;
    gap: 2rem; width:100%;
    align-items: center;
  }

  .wheel-container {
    display:flex; flex-direction:column; align-items:center; gap:1rem;
  }

  .wheel-wrap {
    position: relative;
    width: min(220px, 42vw);
    height: min(220px, 42vw);
  }

  .pointer {
    position:absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 24px solid var(--accent);
    filter: drop-shadow(0 0 8px rgba(240,192,64,0.8));
    z-index: 10;
  }

  canvas.wheel {
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 60px rgba(240,192,64,0.1);
    transition: box-shadow 0.3s;
    width: 100%; height: 100%;
  }

  canvas.wheel.spinning {
    box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 80px rgba(255,77,109,0.4);
  }

  .wheel-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .spin-value {
    font-family: 'Bungee', cursive;
    font-size: 1.8rem;
    color: var(--accent3);
    text-shadow: 0 0 20px rgba(77,255,160,0.5);
    min-height: 2.2rem;
    transition: all 0.3s;
  }

  /* ── ACTION AREA ── */
  .action-area {
    display:flex; flex-direction:column; align-items:center; gap:1rem; width:100%;
  }

  .status-msg {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    min-height: 1.2rem;
    text-align: center;
  }

  /* ── LOG ── */
  .log {
    width:100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    max-height: 120px;
    overflow-y: auto;
    display:flex; flex-direction:column; gap:0.4rem;
  }

  .log-entry {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    animation: fadeIn 0.4s ease;
  }
  .log-entry.highlight { color: var(--accent3); }
  .log-entry.warn { color: var(--accent2); }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(4px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* ── OVERLAY ── */
  .overlay {
    position:fixed; inset:0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index: 100;
    gap: 1.5rem;
  }
  .overlay.show { display:flex; }

  .overlay-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3rem;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { transform:scale(0.7); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }

  .overlay-card h2 {
    font-family: 'Bungee', cursive;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }

  .winner-name {
    font-family: 'Bungee', cursive;
    font-size: 2rem;
    color: var(--accent);
    text-shadow: var(--glow);
    margin: 1rem 0;
  }

  .final-scores {
    display:flex; gap:1rem; justify-content:center; margin:1.5rem 0;
  }
  .final-score-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1.25rem;
    text-align:center;
  }
  .final-score-item .name { font-size:0.8rem; color:var(--muted); font-weight:700; letter-spacing:1px; }
  .final-score-item .pts {
    font-family:'Orbitron', monospace;
    font-size:1.5rem;
    font-weight:900;
    color:var(--accent);
  }

  .btn-row { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }

  /* ── CONFETTI ── */
  .confetti-piece {
    position:fixed;
    top:-10px;
    width:10px; height:10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events:none;
    z-index:200;
  }
  @keyframes confettiFall {
    to { transform: translateY(105vh) rotate(720deg); opacity:0; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 500px) {
    .wheels-area { grid-template-columns: 1fr; gap: 1rem; }
    .scores { grid-template-columns: 1fr 1fr; }
    .wheel-wrap { width: 160px; height: 160px; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<!-- LOBBY -->
<div id="lobby" class="screen active">
  <div class="logo">SPIN<span>BATTLE</span></div>
  <div class="subtitle">Multiplayer Wheel Game</div>
  <div class="input-group">
    <label>Your Name</label>
    <input type="text" id="usernameInput" placeholder="Enter your name..." maxlength="16" />
  </div>
  <button class="btn btn-primary" onclick="joinGame()">ENTER ARENA</button>
</div>

<!-- WAITING -->
<div id="waiting" class="screen">
  <div class="waiting-card">
    <div style="font-family:'Bungee',cursive;font-size:1.5rem;color:var(--accent);margin-bottom:1rem;">FINDING OPPONENT</div>
    <div class="spinner-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div style="color:var(--muted);font-size:0.9rem;letter-spacing:1px;">Searching for a worthy challenger...</div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-header">
    <div class="round-badge" id="roundDisplay">ROUND 1 / 3</div>
    <div class="vs-text">VS</div>
    <div class="round-badge" id="roomDisplay">ROOM —</div>
  </div>

  <div class="scores">
    <div class="score-card me">
      <div class="player-label">You</div>
      <div class="player-name" id="myName">—</div>
      <div class="score-val" id="myScore">0</div>
    </div>
    <div class="score-card opponent">
      <div class="player-label">Opponent</div>
      <div class="player-name" id="oppName">—</div>
      <div class="score-val" id="oppScore">0</div>
    </div>
  </div>

  <div class="wheels-area">
    <div class="wheel-container">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="myWheel" class="wheel" width="300" height="300"></canvas>
      </div>
      <div class="wheel-label">YOUR WHEEL</div>
      <div class="spin-value" id="mySpinVal"></div>
    </div>
    <div class="wheel-container">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="oppWheel" class="wheel" width="300" height="300"></canvas>
      </div>
      <div class="wheel-label">OPPONENT</div>
      <div class="spin-value" id="oppSpinVal"></div>
    </div>
  </div>

  <div class="action-area">
    <div class="status-msg" id="statusMsg">Waiting for match...</div>
    <button class="btn btn-spin" id="spinBtn" onclick="doSpin()" disabled>SPIN THE WHEEL</button>
  </div>

  <div class="log" id="log"></div>
</div>

<!-- RESULT OVERLAY -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-card">
    <h2 id="overlayTitle" style="color:var(--accent)">ROUND OVER</h2>
    <div id="overlayBody"></div>
    <div class="btn-row" style="margin-top:1.5rem">
      <button class="btn btn-primary" onclick="closeOverlay()">NEXT ROUND</button>
    </div>
  </div>
</div>

<!-- GAME OVER OVERLAY -->
<div class="overlay" id="gameOverOverlay">
  <div class="overlay-card">
    <h2 id="gameOverTitle" style="color:var(--accent2)">🏆 GAME OVER</h2>
    <div class="winner-name" id="winnerName"></div>
    <div class="final-scores" id="finalScores"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doRematch()">REMATCH</button>
      <button class="btn btn-secondary" onclick="location.reload()">LEAVE</button>
    </div>
  </div>
</div>

<script>
// ─── SOCKET ───────────────────────────────────────────────
const socket = io({ transports: ["polling", "websocket"] });

// ─── STATE ────────────────────────────────────────────────
let myName = "", oppName = "", myTotal = 0, oppTotal = 0;
let currentRound = 1, totalRounds = 3;
let hasSpun = false;
let myWheelAngle = 0, oppWheelAngle = 0;
const SEGMENTS = [100, 200, 300, 400, 500, 50, 150, 250, 350, 450];
const COLORS = ["#f0c040","#ff4d6d","#4dffa0","#4db8ff","#ff9f40","#c77dff","#ff6b35","#00b4d8","#e63946","#2dc653"];

// ─── DRAW WHEEL ───────────────────────────────────────────
function drawWheel(canvasId, rotation = 0) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const r = cx - 8;
  const sliceAngle = (2 * Math.PI) / SEGMENTS.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  SEGMENTS.forEach((val, i) => {
    const start = rotation + i * sliceAngle;
    const end = start + sliceAngle;
    // Slice
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = "#0a0a0f";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#0a0a0f";
    ctx.font = "bold 18px Orbitron, monospace";
    ctx.fillText(val, r - 12, 6);
    ctx.restore();
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
  ctx.fillStyle = "#0a0a0f";
  ctx.fill();
  ctx.strokeStyle = "#f0c040";
  ctx.lineWidth = 3;
  ctx.stroke();
}

// ─── ANIMATE SPIN ─────────────────────────────────────────
function animateSpin(canvasId, fromAngle, totalDeg, duration, onDone) {
  const canvas = document.getElementById(canvasId);
  const totalRad = (totalDeg * Math.PI) / 180;
  const start = performance.now();

  canvas.classList.add("spinning");

  function frame(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    // Ease out cubic
    const ease = 1 - Math.pow(1 - progress, 3);
    const angle = fromAngle + totalRad * ease;
    drawWheel(canvasId, angle);
    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      canvas.classList.remove("spinning");
      if (onDone) onDone(angle % (2 * Math.PI));
    }
  }
  requestAnimationFrame(frame);
}

// ─── SCREENS ──────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ─── JOIN ─────────────────────────────────────────────────
function joinGame() {
  const input = document.getElementById("usernameInput").value.trim();
  if (!input) { document.getElementById("usernameInput").focus(); return; }
  myName = input;
  showScreen("waiting");
  socket.emit("join", { username: myName });
}

document.getElementById("usernameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") joinGame();
});

// ─── SPIN ─────────────────────────────────────────────────
function doSpin() {
  if (hasSpun) return;
  hasSpun = true;
  document.getElementById("spinBtn").disabled = true;
  setStatus("Spinning...");
  socket.emit("spin");
}

// ─── REMATCH ──────────────────────────────────────────────
function doRematch() {
  document.getElementById("gameOverOverlay").classList.remove("show");
  myTotal = 0; oppTotal = 0;
  document.getElementById("myScore").textContent = "0";
  document.getElementById("oppScore").textContent = "0";
  document.getElementById("mySpinVal").textContent = "";
  document.getElementById("oppSpinVal").textContent = "";
  socket.emit("rematch");
}

// ─── OVERLAY ──────────────────────────────────────────────
function closeOverlay() {
  document.getElementById("resultOverlay").classList.remove("show");
  hasSpun = false;
  document.getElementById("spinBtn").disabled = false;
  setStatus("Your turn — spin the wheel!");
}

// ─── STATUS + LOG ─────────────────────────────────────────
function setStatus(msg) {
  document.getElementById("statusMsg").textContent = msg;
}

function addLog(msg, type = "") {
  const log = document.getElementById("log");
  const el = document.createElement("div");
  el.className = "log-entry " + type;
  el.textContent = msg;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

// ─── CONFETTI ─────────────────────────────────────────────
function spawnConfetti() {
  const colors = ["#f0c040","#ff4d6d","#4dffa0","#4db8ff","#ff9f40","#c77dff"];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.cssText = `
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

// ─── SOCKET EVENTS ────────────────────────────────────────
socket.on("state", (data) => {
  if (data.status === "waiting") {
    showScreen("waiting");
  }
  else if (data.status === "matched" || data.status === "rematch") {
    if (data.status === "matched") {
      myName = data.your_name || myName;
      oppName = data.opponent || "Opponent";
      document.getElementById("myName").textContent = myName;
      document.getElementById("oppName").textContent = oppName;
      const shortRoom = (data.room || "").slice(-8);
      document.getElementById("roomDisplay").textContent = shortRoom;
    }
    currentRound = data.round || 1;
    totalRounds = data.total_rounds || 3;
    document.getElementById("roundDisplay").textContent = `ROUND ${currentRound} / ${totalRounds}`;
    hasSpun = false;
    document.getElementById("spinBtn").disabled = false;
    document.getElementById("mySpinVal").textContent = "";
    document.getElementById("oppSpinVal").textContent = "";
    drawWheel("myWheel", 0);
    drawWheel("oppWheel", 0);
    showScreen("game");
    setStatus("Match found! Spin the wheel!");
    addLog(`⚔️ ${myName} vs ${oppName} — FIGHT!`, "highlight");
  }
  else if (data.status === "opponent_left") {
    addLog("⚠️ " + data.message, "warn");
    setStatus(data.message);
    document.getElementById("spinBtn").disabled = true;
  }
});

socket.on("spin_result", (data) => {
  const isMe = data.username === myName;
  const canvasId = isMe ? "myWheel" : "oppWheel";
  const valId = isMe ? "mySpinVal" : "oppSpinVal";
  const fromAngle = isMe ? myWheelAngle : oppWheelAngle;

  addLog(`🎡 ${data.username} spun the wheel...`);

  animateSpin(canvasId, fromAngle, data.degrees, 4000, (finalAngle) => {
    if (isMe) myWheelAngle = finalAngle;
    else oppWheelAngle = finalAngle;

    document.getElementById(valId).textContent = `+${data.value}`;
    addLog(`✅ ${data.username} landed on ${data.value}!`, "highlight");
  });
});

socket.on("round_result", (data) => {
  currentRound = data.next_round;
  totalRounds = data.total_rounds;
  document.getElementById("roundDisplay").textContent = `ROUND ${currentRound} / ${totalRounds}`;

  myTotal = data.p1.username === myName ? data.p1.total : data.p2.total;
  oppTotal = data.p1.username === myName ? data.p2.total : data.p1.total;
  document.getElementById("myScore").textContent = myTotal;
  document.getElementById("oppScore").textContent = oppTotal;

  const rw = data.round_winner;
  const title = document.getElementById("overlayTitle");
  const body = document.getElementById("overlayBody");

  title.textContent = rw === "Tie" ? "TIE ROUND!" : `${rw} WINS ROUND!`;
  title.style.color = rw === myName ? "var(--accent3)" : rw === "Tie" ? "var(--accent)" : "var(--accent2)";
  body.innerHTML = `
    <div style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;">Round ${currentRound-1} Results</div>
    <div class="final-scores">
      <div class="final-score-item">
        <div class="name">${data.p1.username}</div>
        <div class="pts">${data.p1.total}</div>
      </div>
      <div class="final-score-item">
        <div class="name">${data.p2.username}</div>
        <div class="pts">${data.p2.total}</div>
      </div>
    </div>
    <div style="color:var(--muted);font-size:0.8rem;letter-spacing:2px;">NEXT ROUND STARTING...</div>
  `;
  document.getElementById("resultOverlay").classList.add("show");
  document.getElementById("mySpinVal").textContent = "";
  document.getElementById("oppSpinVal").textContent = "";
  myWheelAngle = 0; oppWheelAngle = 0;
  drawWheel("myWheel", 0);
  drawWheel("oppWheel", 0);
});

socket.on("game_over", (data) => {
  myTotal = data.p1.username === myName ? data.p1.total : data.p2.total;
  oppTotal = data.p1.username === myName ? data.p2.total : data.p1.total;
  document.getElementById("myScore").textContent = myTotal;
  document.getElementById("oppScore").textContent = oppTotal;

  const winner = data.winner;
  document.getElementById("winnerName").textContent = winner === "Tie" ? "IT'S A TIE!" : `🏆 ${winner}`;
  document.getElementById("gameOverTitle").textContent = winner === myName ? "YOU WIN!" : winner === "Tie" ? "DRAW!" : "YOU LOSE!";
  document.getElementById("gameOverTitle").style.color = winner === myName ? "var(--accent3)" : winner === "Tie" ? "var(--accent)" : "var(--accent2)";
  document.getElementById("finalScores").innerHTML = `
    <div class="final-score-item">
      <div class="name">${data.p1.username}</div>
      <div class="pts">${data.p1.total}</div>
    </div>
    <div class="final-score-item">
      <div class="name">${data.p2.username}</div>
      <div class="pts">${data.p2.total}</div>
    </div>
  `;
  document.getElementById("gameOverOverlay").classList.add("show");
  if (winner === myName) spawnConfetti();
  addLog(winner === "Tie" ? "🤝 It's a tie!" : `🏆 ${winner} wins the game!`, "highlight");
});

socket.on("error", (data) => {
  addLog("⚠️ " + data.message, "warn");
});

// ─── INIT WHEELS ──────────────────────────────────────────
window.addEventListener("load", () => {
  drawWheel("myWheel", 0);
  drawWheel("oppWheel", 0);
});
</script>
</body>
</html>
